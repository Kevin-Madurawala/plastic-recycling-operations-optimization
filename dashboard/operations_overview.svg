<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .bg{fill:#f7f7f7}.card{fill:#fff;stroke:#e5e5e5;stroke-width:1}.title{font:700 26px Arial,sans-serif;fill:#222}.h{font:600 16px Arial,sans-serif;fill:#333}.label{font:13px Arial,sans-serif;fill:#555}.value{font:700 25px Arial,sans-serif;fill:#222}.axis{stroke:#d9d9d9;stroke-width:1}.bar{fill:#3b82f6}.line{fill:none;stroke:#3b82f6;stroke-width:3}.dot{fill:#3b82f6}.small{font:11px Arial,sans-serif;fill:#666}.grid{stroke:#ececec;stroke-width:1}
  </style>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="600" y="42" text-anchor="middle">Operations Overview</text>

  <g transform="translate(40,75)">
    <rect class="card" width="190" height="100" rx="8"/><text class="label" x="18" y="35">Average Throughput</text><text class="value" x="18" y="70">149.3</text><text class="small" x="88" y="70">kg/hr</text>
  </g>
  <g transform="translate(245,75)">
    <rect class="card" width="190" height="100" rx="8"/><text class="label" x="18" y="35">Average Yield</text><text class="value" x="18" y="70">88.27%</text>
  </g>
  <g transform="translate(40,190)">
    <rect class="card" width="190" height="100" rx="8"/><text class="label" x="18" y="35">Total Downtime Hours</text><text class="value" x="18" y="70">188.4</text>
  </g>
  <g transform="translate(245,190)">
    <rect class="card" width="190" height="100" rx="8"/><text class="label" x="18" y="35">On-Time Pickup Rate</text><text class="value" x="18" y="70">87.00%</text>
  </g>

  <g transform="translate(470,75)">
    <rect class="card" width="330" height="280" rx="8"/>
    <text class="h" x="16" y="30">Average Processing Throughput by Material</text>
    <line class="axis" x1="70" y1="245" x2="310" y2="245"/>
    <g class="small"><text x="52" y="73">PET</text><text x="45" y="112">HDPE</text><text x="55" y="151">PP</text><text x="46" y="190">LDPE</text><text x="42" y="229">Mixed</text></g>
    <rect class="bar" x="70" y="57" width="223" height="22" rx="2"/><text class="small" x="299" y="73">185.7</text>
    <rect class="bar" x="70" y="96" width="200" height="22" rx="2"/><text class="small" x="276" y="112">166.9</text>
    <rect class="bar" x="70" y="135" width="190" height="22" rx="2"/><text class="small" x="266" y="151">158.2</text>
    <rect class="bar" x="70" y="174" width="164" height="22" rx="2"/><text class="small" x="240" y="190">136.6</text>
    <rect class="bar" x="70" y="213" width="124" height="22" rx="2"/><text class="small" x="200" y="229">103.4</text>
  </g>

  <g transform="translate(820,75)">
    <rect class="card" width="330" height="280" rx="8"/>
    <text class="h" x="16" y="30">Average Yield by Material</text>
    <line class="axis" x1="50" y1="245" x2="310" y2="245"/>
    <g class="grid"><line x1="50" y1="205" x2="310" y2="205"/><line x1="50" y1="165" x2="310" y2="165"/><line x1="50" y1="125" x2="310" y2="125"/><line x1="50" y1="85" x2="310" y2="85"/></g>
    <rect class="bar" x="70" y="60" width="32" height="185"/><rect class="bar" x="118" y="64" width="32" height="181"/><rect class="bar" x="166" y="66" width="32" height="179"/><rect class="bar" x="214" y="72" width="32" height="173"/><rect class="bar" x="262" y="89" width="32" height="156"/>
    <g class="small" text-anchor="middle"><text x="86" y="55">93.40%</text><text x="134" y="59">91.45%</text><text x="182" y="61">90.51%</text><text x="230" y="67">87.73%</text><text x="278" y="84">78.90%</text><text x="86" y="265">PET</text><text x="134" y="265">HDPE</text><text x="182" y="265">PP</text><text x="230" y="265">LDPE</text><text x="278" y="265">Mixed</text></g>
  </g>

  <g transform="translate(470,380)">
    <rect class="card" width="500" height="270" rx="8"/>
    <text class="h" x="16" y="30">Monthly Production Output</text>
    <g class="grid"><line x1="60" y1="70" x2="465" y2="70"/><line x1="60" y1="135" x2="465" y2="135"/><line x1="60" y1="200" x2="465" y2="200"/></g>
    <polyline class="line" points="70,124 104,198 138,180 172,123 206,70 240,128 274,198 308,105 342,116 376,202 410,117 444,124"/>
    <g class="dot"><circle cx="70" cy="124" r="4"/><circle cx="104" cy="198" r="4"/><circle cx="138" cy="180" r="4"/><circle cx="172" cy="123" r="4"/><circle cx="206" cy="70" r="4"/><circle cx="240" cy="128" r="4"/><circle cx="274" cy="198" r="4"/><circle cx="308" cy="105" r="4"/><circle cx="342" cy="116" r="4"/><circle cx="376" cy="202" r="4"/><circle cx="410" cy="117" r="4"/><circle cx="444" cy="124" r="4"/></g>
    <g class="small" text-anchor="middle"><text x="70" y="230">Jan</text><text x="104" y="230">Feb</text><text x="138" y="230">Mar</text><text x="172" y="230">Apr</text><text x="206" y="230">May</text><text x="240" y="230">Jun</text><text x="274" y="230">Jul</text><text x="308" y="230">Aug</text><text x="342" y="230">Sep</text><text x="376" y="230">Oct</text><text x="410" y="230">Nov</text><text x="444" y="230">Dec</text></g>
  </g>

  <g transform="translate(990,380)"><rect class="card" width="160" height="90" rx="8"/><text class="label" x="16" y="28">Material Filter</text><rect x="16" y="42" width="128" height="28" rx="4" fill="#fafafa" stroke="#d9d9d9"/><text class="small" x="27" y="60">All</text><text class="small" x="126" y="60">▼</text></g>
</svg>
