<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    .bg{fill:#f7f7f7}.card{fill:#fff;stroke:#e5e5e5;stroke-width:1}.title{font:700 26px Arial,sans-serif;fill:#222}.h{font:600 16px Arial,sans-serif;fill:#333}.label{font:13px Arial,sans-serif;fill:#555}.value{font:700 26px Arial,sans-serif;fill:#222}.axis{stroke:#d9d9d9;stroke-width:1}.bar{fill:#3b82f6}.grid{stroke:#ececec;stroke-width:1}.small{font:11px Arial,sans-serif;fill:#666}.finding{font:13px Arial,sans-serif;fill:#222}
  </style>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="42" text-anchor="middle">Continuous Improvement Analysis</text>

  <g transform="translate(55,75)">
    <rect class="card" width="330" height="255" rx="8"/>
    <text class="h" x="16" y="30">Total Downtime by Cause</text>
    <g class="small"><text x="16" y="65">Maintenance</text><text x="16" y="92">Material Jam</text><text x="16" y="119">Sensor Fault</text><text x="16" y="146">Changeover</text><text x="16" y="173">Cleaning</text><text x="16" y="200">Contamination</text><text x="16" y="227">Operator Delay</text></g>
    <rect class="bar" x="105" y="50" width="197" height="17"/><rect class="bar" x="105" y="77" width="154" height="17"/><rect class="bar" x="105" y="104" width="71" height="17"/><rect class="bar" x="105" y="131" width="59" height="17"/><rect class="bar" x="105" y="158" width="56" height="17"/><rect class="bar" x="105" y="185" width="42" height="17"/><rect class="bar" x="105" y="212" width="28" height="17"/>
    <text class="small" x="305" y="65">3,668</text><text class="small" x="263" y="92">2,875</text>
  </g>

  <g transform="translate(815,75)">
    <rect class="card" width="330" height="255" rx="8"/>
    <text class="h" x="16" y="30">Total Downtime by Machine</text>
    <g class="small"><text x="16" y="68">Sorter 1</text><text x="16" y="103">Shredder 1</text><text x="16" y="138">Shredder 2</text><text x="16" y="173">Pelletizer 1</text><text x="16" y="208">Washer 1</text></g>
    <rect class="bar" x="88" y="52" width="205" height="19"/><rect class="bar" x="88" y="87" width="201" height="19"/><rect class="bar" x="88" y="122" width="186" height="19"/><rect class="bar" x="88" y="157" width="160" height="19"/><rect class="bar" x="88" y="192" width="126" height="19"/>
    <text class="small" x="298" y="68">2,639</text>
  </g>

  <g transform="translate(420,135)">
    <rect class="card" width="330" height="150" rx="8"/>
    <text class="label" x="22" y="52">Average Contamination</text>
    <text class="value" x="22" y="92">5.36%</text>
  </g>

  <g transform="translate(55,360)">
    <rect class="card" width="330" height="250" rx="8"/>
    <text class="h" x="16" y="30">Average Contamination by Material</text>
    <g class="grid"><line x1="45" y1="205" x2="310" y2="205"/><line x1="45" y1="157" x2="310" y2="157"/><line x1="45" y1="109" x2="310" y2="109"/><line x1="45" y1="61" x2="310" y2="61"/></g>
    <rect class="bar" x="70" y="58" width="30" height="147"/><rect class="bar" x="118" y="74" width="30" height="131"/><rect class="bar" x="166" y="77" width="30" height="128"/><rect class="bar" x="214" y="83" width="30" height="122"/><rect class="bar" x="262" y="89" width="30" height="116"/>
    <g class="small" text-anchor="middle"><text x="85" y="53">6.11%</text><text x="133" y="69">5.47%</text><text x="181" y="72">5.36%</text><text x="229" y="78">5.11%</text><text x="277" y="84">4.82%</text><text x="85" y="225">PP</text><text x="133" y="225">PET</text><text x="181" y="225">HDPE</text><text x="229" y="225">Mixed</text><text x="277" y="225">LDPE</text></g>
  </g>

  <g transform="translate(815,360)">
    <rect class="card" width="330" height="250" rx="8"/>
    <text class="h" x="16" y="30">Yield vs Contamination by Material</text>
    <line class="axis" x1="55" y1="205" x2="300" y2="205"/><line class="axis" x1="55" y1="55" x2="55" y2="205"/>
    <g class="grid"><line x1="55" y1="165" x2="300" y2="165"/><line x1="55" y1="125" x2="300" y2="125"/><line x1="55" y1="85" x2="300" y2="85"/></g>
    <circle cx="160" cy="86" r="7" fill="#3b82f6"/><circle cx="108" cy="102" r="7" fill="#1e40af"/><circle cx="245" cy="108" r="7" fill="#ec4899"/><circle cx="135" cy="190" r="7" fill="#f97316"/><circle cx="175" cy="75" r="7" fill="#7e22ce"/>
    <g class="small"><text x="55" y="224">4.5%</text><text x="160" y="224">5.5%</text><text x="265" y="224">6.5%</text><text x="17" y="205">75%</text><text x="17" y="165">80%</text><text x="17" y="125">85%</text><text x="17" y="85">90%</text><text x="17" y="58">95%</text></g>
  </g>

  <g transform="translate(420,350)">
    <rect class="card" width="330" height="260" rx="8"/>
    <text class="h" x="18" y="32">Key Findings &amp; Improvement Opportunities</text>
    <text class="finding" x="20" y="68">• Maintenance + material jams = 57.9% of downtime.</text>
    <text class="finding" x="20" y="101">• Mixed plastic had the lowest throughput and yield.</text>
    <text class="finding" x="20" y="134">• Sorter 1 had the highest recorded machine downtime.</text>
    <text class="finding" x="20" y="167">• Contamination alone did not explain yield differences.</text>
    <text class="finding" x="20" y="204">Recommended focus:</text>
    <text class="finding" x="20" y="229">preventive maintenance, material inspection,</text>
    <text class="finding" x="20" y="250">root-cause analysis, and production sequencing.</text>
  </g>
</svg>
